name: Manual Generate Android APK
on:
  workflow_dispatch:
    inputs:
      buildVariant:
        type: choice
        description: 'Build Variant'
        required: true
        default: 'NormalOptimized'
        options:
          - NormalOptimized
          - NormalDebug
          - VROptimized
          - VRDebug
          - LegacyOptimized

jobs:
  apk:
    name: Generate ${{ github.event.inputs.buildVariant }} APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/hrydgard/ppsspp.git || true
          git fetch --deepen=15000 --no-recurse-submodules --tags --force upstream || exit 0

      - name: Setup JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Assemble APK
        run: ./gradlew assemble${{ github.event.inputs.buildVariant }} --stacktrace

      - name: Package build
        run: |
          mkdir -p ppsspp
          find . -path "*/build/outputs/apk/*/*.apk" -exec cp {} ppsspp/ \;
          ls -la ppsspp/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ github.event.inputs.buildVariant }}
          path: ppsspp/
